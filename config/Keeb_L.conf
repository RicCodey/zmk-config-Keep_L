# ============================================================
# Keeb_L
# Nice!Nano V2
# Single left half
# Bluetooth
# Built-in ZMK OLED display
# ============================================================


# ============================================================
# BLUETOOTH
# ============================================================

CONFIG_ZMK_BLE=y

# This is currently NOT a split keyboard
CONFIG_ZMK_SPLIT=n


# ============================================================
# MATRIX
# ============================================================

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10


# ============================================================
# ROTARY ENCODER
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# ============================================================
# OLED DISPLAY
# ============================================================

CONFIG_ZMK_DISPLAY=y

# Use ZMK's built-in display instead of custom LVGL code
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Battery information for the built-in display
CONFIG_ZMK_BATTERY_REPORTING=y


# ============================================================
# USB
# ============================================================

# USB remains enabled by the Nice!Nano board configuration.