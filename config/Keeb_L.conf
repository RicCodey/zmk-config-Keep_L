# ============================================================
# Keeb_L
# Nice!Nano V2
# Single left half
# Bluetooth master
# OLED enabled
# ============================================================


# ============================================================
# BLUETOOTH
# ============================================================

CONFIG_ZMK_BLE=y

# This is currently NOT a split keyboard.
CONFIG_ZMK_SPLIT=n

# ============================================================
# MATRIX
# ============================================================

# Matrix scanning is configured in Keeb_L.overlay.
# Do NOT use CONFIG_ZMK_KSCAN_MATRIX here because this
# symbol is not present in the ZMK version being used.

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10


# ============================================================
# ROTARY ENCODER
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# ============================================================
# OLED DISPLAY
# ============================================================

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_Z_MEM_POOL_SIZE=8192


# ============================================================
# USB
# ============================================================

# USB remains available through the Nice!Nano board.